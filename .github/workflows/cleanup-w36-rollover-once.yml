name: Final W35 to W36 rollover cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-w36-rollover-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Align final rollover surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          coverage = Path("data/DATA_COVERAGE.md")
          text = coverage.read_text(encoding="utf-8")
          replacements = {
              "Canonical curated sleep has 203 continuous daily rows through 2026-08-30; broader RingConn episode export retained separately":
                  "Canonical curated sleep has 210 continuous daily rows through 2026-09-06; broader RingConn episode export retained separately",
              "2026-02-09 through 2026-08-30\n203 continuous daily records":
                  "2026-02-09 through 2026-09-06\n210 continuous daily records",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"DATA_COVERAGE.md expected one match for {old!r}, found {count}")
              text = text.replace(old, new, 1)
          coverage.write_text(text, encoding="utf-8")

          report = Path("reports/2026-W36.md")
          rtext = report.read_text(encoding="utf-8")
          cleaned = "\n".join(line.rstrip(" \t") for line in rtext.splitlines())
          if rtext.endswith("\n"):
              cleaned += "\n"
          report.write_text(cleaned, encoding="utf-8")
          PY

      - name: Validate final state
        shell: bash
        run: |
          python -m py_compile tools/validate_machine_readable.py tools/validate_repository.py
          python tools/validate_repository.py
          python tools/validate_machine_readable.py
          git diff --check

      - name: Commit final cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/DATA_COVERAGE.md reports/2026-W36.md
          git diff --cached --quiet || git commit -m "docs: align sleep coverage and clean W36 report"

      - name: Remove one-time cleanup workflow
        shell: bash
        run: |
          git rm .github/workflows/cleanup-w36-rollover-once.yml
          git commit -m "chore: remove one-time W36 cleanup workflow"

      - name: Push cleanup commits
        run: git push origin HEAD:main
