name: One-time machine-readable closeout documentation

on:
  push:
    paths:
      - .github/workflows/closeout-machine-readable-docs.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align closeout documentation
        run: python tools/_closeout_machine_readable_docs_once.py

      - name: Commit closeout documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERIFICATION.md CHANGELOG.md DATA_DICTIONARY.md DATASET_OVERVIEW.md schemas/machine-readable-layer-v1.md data/source_provenance/README.md
          git diff --cached --quiet && exit 0
          git commit -m "Close machine-readable hardening cycle"
          git push
