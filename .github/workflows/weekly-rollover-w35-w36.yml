name: One-time W35 to W36 rollover

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/weekly-rollover-w35-w36.yml

permissions:
  contents: write

jobs:
  rollover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare W35 closeout and W36 opening
        run: python tools/_rollover_w35_to_w36_once.py

      - name: Validate prepared repository
        shell: bash
        run: |
          python -m py_compile tools/validate_machine_readable.py tools/validate_repository.py
          python tools/validate_repository.py
          python tools/validate_machine_readable.py
          git diff --check

      - name: Commit machine-readable extension
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/daily_biomarkers_v1.csv \
            data/sleep_longitudinal_v1.csv \
            data/training_blocks_v1.csv \
            data/context_events_v1.csv \
            data/DATA_COVERAGE.md \
            data/source_provenance/daniel_dataset_private_manifest.csv \
            data/source_provenance/README.md \
            schemas/machine-readable-layer-v1.md \
            tools/validate_machine_readable.py \
            VERIFICATION.md
          git diff --cached --quiet || git commit -m "data: extend machine-readable layer through W35"

      - name: Commit report rollover
        shell: bash
        run: |
          git add reports/2026-W35.md reports/2026-W36.md
          git diff --cached --quiet || git commit -m "reports: close W35 and open W36"

      - name: Commit current-state tightening
        shell: bash
        run: |
          git add \
            LATEST.md README.md INDEX.md \
            DATASET_OVERVIEW.md DATA_DICTIONARY.md \
            docs/START_HERE.md docs/FOR_OBSERVERS.md \
            docs/NEWCOMER_PATH.md docs/OBSERVER_QUICKSTART.md \
            docs/CONCEPTS.md methodology/README.md
          git diff --cached --quiet || git commit -m "docs: advance current state to W36 and centralize live coverage"

      - name: Commit changelog maintenance
        shell: bash
        run: |
          git add CHANGELOG.md docs/archive/CHANGELOG_ARCHIVE.md
          git diff --cached --quiet || git commit -m "chore: document W35 closeout and archive historical changelog"

      - name: Remove one-time helper
        shell: bash
        run: |
          git rm tools/_rollover_w35_to_w36_once.py .github/workflows/weekly-rollover-w35-w36.yml
          git commit -m "chore: remove one-time W35 rollover helper"

      - name: Push rollover commits
        run: git push origin HEAD:main
