name: Post-rollover audit hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/post-rollover-audit-hardening-once.yml

permissions:
  contents: write

jobs:
  audit-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Apply audit remediations
        run: python tools/_post_rollover_audit_hardening_once.py

      - name: Validate remediated repository
        shell: bash
        run: |
          python -m py_compile tools/validate_repository.py tools/validate_machine_readable.py
          python tools/validate_repository.py
          python tools/validate_machine_readable.py
          git diff --check

      - name: Mark audit validation pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/audits/2026-09-07-post-weekly-rollover-audit.md")
          text = path.read_text(encoding="utf-8")
          old = "**Validation status:** PENDING_FINAL_VALIDATION"
          new = "**Validation status:** PASS — core validator, machine-readable validator, Python compilation, and `git diff --check`"
          if text.count(old) != 1:
              raise SystemExit("audit validation status marker not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Commit audit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            methodology/README.md \
            reports/README.md \
            tools/validate_repository.py \
            tools/README.md \
            VERIFICATION.md \
            CHANGELOG.md \
            docs/audits/2026-09-07-post-weekly-rollover-audit.md
          git diff --cached --quiet || git commit -m "audit: harden post-rollover state verification"

      - name: Remove one-time audit helpers
        shell: bash
        run: |
          git rm .github/workflows/post-rollover-audit-hardening-once.yml tools/_post_rollover_audit_hardening_once.py
          git commit -m "chore: remove one-time post-rollover audit helpers"

      - name: Push audit commits
        run: git push origin HEAD:main
